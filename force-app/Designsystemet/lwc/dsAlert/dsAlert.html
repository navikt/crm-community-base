<template>
    <div data-color={alertType} data-size={size} class="aksel-inline-message aksel-body-long aksel-body-long--medium">
        <svg
            xmlns="http://www.w3.org/2000/svg"
            width="1em"
            height="1em"
            fill="none"
            viewBox="0 0 24 24"
            focusable="false"
            role="img"
            class="aksel-inline-message__icon"
            aria-hidden="true"
        >
            <path
                fill="currentColor"
                fill-rule="evenodd"
                d={iconPath}
                clip-rule="evenodd"
            ></path>
        </svg>
        <span data-color="accent"><slot>{alertText}</slot></span>
    </div>
</template>
