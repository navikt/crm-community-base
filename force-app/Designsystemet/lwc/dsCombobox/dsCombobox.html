<template>
    <div class={fieldClass} onfocusout={handleFocusOut}>
        <label for={inputId} class="aksel-form-field__label aksel-label"> {label} </label>

        <div class="aksel-combobox__wrapper">
            <div class={wrapperInnerClass}>
                <ul
                    data-type="single"
                    class="aksel-chips aksel-combobox__selected-options aksel-chips--medium aksel-body-short aksel-body-short--small"
                >
                    <template lwc:if={showSelectedLabel}>
                        <li>
                            <div class="aksel-combobox__selected-options--no-bg" onclick={handleSelectedLabelClick}>
                                {selectedLabel}
                            </div>
                        </li>
                    </template>

                    <li>
                        <input
                            id={inputId}
                            class="aksel-combobox__input aksel-body-short aksel-body-short--medium"
                            role="combobox"
                            type="text"
                            autocomplete="off"
                            aria-haspopup="listbox"
                            aria-autocomplete="list"
                            aria-controls={listId}
                            aria-expanded={isOpen}
                            aria-invalid={hasError}
                            aria-required={required}
                            aria-describedby={describedBy}
                            value={searchText}
                            placeholder={inputPlaceholder}
                            onfocus={handleInputFocus}
                            onclick={handleInputClick}
                            oninput={handleInput}
                            onkeydown={handleInputKeydown}
                        />
                    </li>
                </ul>

                <div
                    class="aksel-combobox__button-toggle-list"
                    aria-hidden="true"
                    onmousedown={handlePreserveFocus}
                    onclick={toggleList}
                >
                    <svg
                        xmlns="http://www.w3.org/2000/svg"
                        width="1em"
                        height="1em"
                        fill="none"
                        viewBox="0 0 24 24"
                        focusable="false"
                    >
                        <path fill="currentColor" fill-rule="evenodd" clip-rule="evenodd" d={chevronPath}></path>
                    </svg>
                </div>
            </div>

            <div data-aksel-floating-content-wrapper class="combobox-floating-wrapper" hidden={listHidden}>
                <div data-side="bottom" data-align="center" class={listClass}>
                    <ul
                        id={listId}
                        role="listbox"
                        aria-label={label}
                        class="aksel-combobox__list-options"
                        onmousedown={handlePreserveFocus}
                    >
                        <template for:each={computedOptions} for:item="option">
                            <li
                                key={option.domId}
                                id={option.domId}
                                class={option.className}
                                role="option"
                                tabindex="-1"
                                aria-selected={option.selected}
                                data-index={option.index}
                                onmouseenter={handleOptionMouseEnter}
                                onclick={handleOptionClick}
                            >
                                <p class="aksel-body-short aksel-body-short--medium">{option.label}</p>

                                <template lwc:if={option.isSelected}>
                                    <svg
                                        xmlns="http://www.w3.org/2000/svg"
                                        width="1em"
                                        height="1em"
                                        fill="none"
                                        viewBox="0 0 24 24"
                                        focusable="false"
                                        aria-hidden="true"
                                    >
                                        <path
                                            fill="currentColor"
                                            fill-rule="evenodd"
                                            clip-rule="evenodd"
                                            d="M18.998 6.94a.75.75 0 0 1 .063 1.058l-8 9a.75.75 0 0 1-1.091.032l-5-5a.75.75 0 1 1 1.06-1.06l4.438 4.437 7.471-8.405A.75.75 0 0 1 19 6.939"
                                        ></path>
                                    </svg>
                                </template>
                            </li>
                        </template>
                    </ul>

                    <template lwc:if={hasNoOptions}>
                        <div class="aksel-combobox__list-item--no-options" role="status">
                            <p class="aksel-body-short aksel-body-short--medium">Ingen treff</p>
                        </div>
                    </template>
                </div>
            </div>
        </div>

        <div id={errorId} class="aksel-form-field__error" aria-relevant="additions removals" aria-live="polite">
            <template lwc:if={hasErrorMessage}>
                <p class="aksel-error-message aksel-label aksel-error-message--show-icon">
                    <svg
                        viewBox="0 0 17 16"
                        fill="none"
                        xmlns="http://www.w3.org/2000/svg"
                        focusable="false"
                        aria-hidden="true"
                    >
                        <path
                            fill-rule="evenodd"
                            clip-rule="evenodd"
                            fill="currentColor"
                            d="M3.49209 11.534L8.11398 2.7594C8.48895 2.04752 9.50833 2.04743 9.88343 2.75924L14.5073 11.5339C14.8582 12.1998 14.3753 13 13.6226 13H4.37685C3.6242 13 3.14132 12.1999 3.49209 11.534ZM9.74855 10.495C9.74855 10.9092 9.41276 11.245 8.99855 11.245C8.58433 11.245 8.24855 10.9092 8.24855 10.495C8.24855 10.0808 8.58433 9.74497 8.99855 9.74497C9.41276 9.74497 9.74855 10.0808 9.74855 10.495ZM9.49988 5.49997C9.49988 5.22383 9.27602 4.99997 8.99988 4.99997C8.72373 4.99997 8.49988 5.22383 8.49988 5.49997V7.99997C8.49988 8.27611 8.72373 8.49997 8.99988 8.49997C9.27602 8.49997 9.49988 8.27611 9.49988 7.99997V5.49997Z"
                        ></path>
                    </svg>
                    {displayError}
                </p>
            </template>
        </div>
    </div>
</template>
